name: CI

on:
  push:
    branches: [ main, ananya/dev, anivartha/dev, ayush/dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        folder: [Ananya, anivartha, Ayush]
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.folder }}/package.json
      
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: ${{ matrix.folder }}/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('${{ matrix.folder }}/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      
      - name: Install dependencies
        working-directory: ${{ matrix.folder }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      
      - name: Build
        working-directory: ${{ matrix.folder }}
        run: npm run build
      
      - name: Test
        working-directory: ${{ matrix.folder }}
        run: npm test
